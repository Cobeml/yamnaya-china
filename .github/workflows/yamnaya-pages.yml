name: Yamnaya Quarto Pages
run-name: Quarto ${{ inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      artifact_sha:
        required: true
        type: string
      build_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.artifact_sha }}
          persist-credentials: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v4
